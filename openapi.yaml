openapi: 3.1.0
info:
  title: KePixel Universal Tracking & Funnel Scanner
  version: 3.0.0
  description: Audits public website tracking technologies, funnel readiness, event quality, and public server-side evidence.
servers:
  - url: https://kepixel-tracking-scanner.vercel.app
paths:
  /api/scan:
    post:
      operationId: scanWebsiteTracking
      summary: Audit a public website's tracking and funnel readiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: Public HTTP or HTTPS website URL.
                  examples: [https://example.com]
                mode:
                  type: string
                  enum: [quick, smart, funnel, deep]
                  default: smart
                max_pages:
                  type: integer
                  minimum: 1
                  maximum: 6
      responses:
        "200":
          description: Completed, partial, fallback, or target-site scan failure result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Invalid or prohibited scan target.
        "405":
          description: Unsupported HTTP method.
        "429":
          description: Rate limit exceeded.
components:
  schemas:
    ScoreDimension:
      type: object
      properties:
        score:
          type: [integer, "null"]
        assessable:
          type: boolean
        confidence:
          type: integer
    Technology:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        methods:
          type: array
          items: { type: string }
        detected_methods:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [detected, possible, not_detected]
        confidence:
          type: integer
        evidence:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              value: { type: string }
    Issue:
      type: object
      properties:
        id: { type: string }
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        scope: { type: string }
        title: { type: string }
        impact: { type: string }
        recommended_fix: { type: string }
        priority: { type: integer }
    ScanResult:
      type: object
      additionalProperties: true
      properties:
        schema_version: { type: string }
        scanner_version: { type: string }
        scan_id: { type: string }
        status: { type: string }
        url: { type: string }
        final_url: { type: string }
        scan_mode: { type: string }
        overall_score: { type: integer }
        tracking_health: { type: string }
        scores:
          type: object
          additionalProperties: true
          properties:
            overall: { type: integer }
            confidence: { type: integer }
            dimensions:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/ScoreDimension"
        technologies:
          type: array
          items:
            $ref: "#/components/schemas/Technology"
        funnel:
          type: object
          additionalProperties: true
        issues:
          type: array
          items:
            $ref: "#/components/schemas/Issue"
        recommendations:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
